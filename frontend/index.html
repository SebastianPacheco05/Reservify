<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon_reservify.svg" />
    <link rel="apple-touch-icon" href="/icon_reservify.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Reserva en tu restaurante favorito. Desde comida gourmet hasta cocina casera, encuentra el lugar ideal para cada ocasión."
    />
    <meta
      name="theme-color"
      content="#0f172a"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#f8fafc"
      media="(prefers-color-scheme: light)"
    />
    <meta name="robots" content="index, follow" />
    <title>Reservify – Reserva en tu restaurante favorito</title>
    <!-- Google Sans (única tipografía del proyecto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap");
    </style>
    <!-- Preconnect a orígenes externos para reducir latencia -->
    <link rel="preconnect" href="https://checkout.wompi.co" crossorigin />
    <!-- Wompi se carga en defer para no bloquear el LCP -->
    <script src="https://checkout.wompi.co/widget.js" defer></script>
    <style>
      /* Fallback de carga antes de que React/Tailwind inicien */
      #app-loading {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Google Sans", system-ui, sans-serif;
        font-size: 1rem;
        background: #f9f7f2; /* light default */
        color: rgba(45, 49, 66, 0.75);
      }
      @media (prefers-color-scheme: dark) {
        #app-loading {
          background: #121212;
          color: rgba(224, 224, 224, 0.8);
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <noscript>Activa JavaScript para usar Reservify.</noscript>
      <!-- Contenido mínimo para FCP; React lo reemplaza al cargar -->
      <div id="app-loading">
        Cargando Reservify…
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
